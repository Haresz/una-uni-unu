<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="UNA-UNI-UNU">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14724c" />
      <stop offset="1" stop-color="#062018" />
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#1f2430" />
      <rect width="7" height="14" fill="#2b3345" />
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)" />
  <rect x="9" y="9" width="82" height="82" rx="16" fill="url(#stripes)" />
  <rect x="9" y="9" width="82" height="82" rx="16" fill="url(#shine)" />
  <rect
    x="9"
    y="9"
    width="82"
    height="82"
    rx="16"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.5"
    stroke-width="3"
  />

  <g transform="translate(50 50)">
    <path d="M0 0 L0 -30 A30 30 0 0 1 30 0 Z" fill="#e0483c" />
    <path d="M0 0 L30 0 A30 30 0 0 1 0 30 Z" fill="#f2b632" />
    <path d="M0 0 L0 30 A30 30 0 0 1 -30 0 Z" fill="#3fa34d" />
    <path d="M0 0 L-30 0 A30 30 0 0 1 0 -30 Z" fill="#2f6fdb" />
    <circle r="9" fill="#ffffff" />
  </g>
</svg>
